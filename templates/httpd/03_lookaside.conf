<VirtualHost *:80>
  ServerName {{ lookaside_http_hostname }}
  CustomLog logs/{{ lookaside_http_hostname }}_access.log combined
  ErrorLog logs/{{ lookaside_http_hostname }}_error.log
  DocumentRoot {{ lookaside_rootpath }}

   RewriteEngine On
   RewriteCond $1 !^.well-known
   RewriteCond %{HTTPS} !=on
   RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R,L]

</VirtualHost>

