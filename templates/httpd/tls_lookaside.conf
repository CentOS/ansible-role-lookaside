<VirtualHost *:443>
 ServerAdmin webmaster@centos.org
 ServerName {{ lookaside_http_hostname }}
 ServerAlias {{ lookaside_http_alias }}
 DocumentRoot {{ lookaside_rootpath }}/lookaside


Header always set Strict-Transport-Security "max-age=31536000"

{{ lookaside_http_snippet }}

ErrorLog logs/{{ lookaside_http_hostname }}_error.log
TransferLog logs/{{ lookaside_http_hostname }}_access.log
LogLevel warn
SSLEngine on

{{ httpd_tls_ciphers }}

SSLCertificateFile /etc/pki/tls/certs/{{ lookaside_http_hostname }}.crt
SSLCertificateKeyFile /etc/pki/tls/private/{{ lookaside_http_hostname }}.key
SSLCertificateChainFile /etc/pki/tls/certs/{{ lookaside_http_hostname }}-CAChain.crt

SSLCACertificateFile /etc/pki/tls/certs/{{ lookaside_fas_ca_crt }}
SSLVerifyClient optional 
SSLOptions +OptRenegotiate

ScriptAlias /sources/upload.cgi /var/www/cgi-bin/upload.cgi
ScriptAlias /sources/upload_sig.cgi /var/www/cgi-bin/upload_sig.cgi

Alias /sources/ {{ lookaside_rootpath }}/lookaside/
Alias /sources {{ lookaside_rootpath }}/lookaside/

<Directory "{{ lookaside_rootpath }}/lookaside/">
  HeaderName /centos-design/header-centos-sigs-sources.html
  AllowOverride Indexes
  Options Indexes FollowSymLinks
  <IfVersion < 2.4>
    Order allow,deny
    Allow from all
  </IfVersion>
  <IfVersion >= 2.4>
    IndexOptions FancyIndexing VersionSort NameWidth=* HTMLTable Charset=UTF-8
    Require all granted
  </IfVersion>
</Directory>

<Directory /sources/>
    SSLVerifyClient optional
    SSLVerifyDepth 1
    SSLOptions +StrictRequire +StdEnvVars +OptRenegotiate
    # require that the client auth cert was created by us and signed by us
    SSLRequire ( %{SSL_CIPHER} !~ m/^(EXP|NULL)/ \
                and %{SSL_CLIENT_I_DN_O} eq "{{ lookaside_fas_ca_issuer_org }}")
</Directory>

<Location /sources/upload.cgi>
    SSLRequireSSL

    Options +ExecCGI
    Require all granted

    SSLVerifyClient optional
    SSLVerifyDepth 1
    SSLOptions +StrictRequire +StdEnvVars +OptRenegotiate
    # require that the access comes from internal or that
    # the client auth cert was created by us and signed by us
    SSLRequire ( %{SSL_CIPHER} !~ m/^(EXP|NULL)/ \
                and %{SSL_CLIENT_I_DN_O} eq "{{ lookaside_fas_ca_issuer_org }}")
</Location>

<Location /sources/upload_sig.cgi>
    SSLRequireSSL

    Options +ExecCGI
    Require all granted

    SSLVerifyClient optional
    SSLVerifyDepth 1
    SSLOptions +StrictRequire +StdEnvVars +OptRenegotiate
    # require that the access comes from internal or that
    # the client auth cert was created by us and signed by us
    SSLRequire ( %{SSL_CIPHER} !~ m/^(EXP|NULL)/ \
                and %{SSL_CLIENT_I_DN_O} eq "{{ lookaside_fas_ca_issuer_org }}")
</Location>


<Files ~ "\.(cgi|shtml|phtml|php3?)$">
    SSLOptions +StdEnvVars
</Files>
<Directory "/var/www/cgi-bin">
    SSLOptions +StdEnvVars
</Directory>
SetEnvIf User-Agent ".*MSIE.*" \
         nokeepalive ssl-unclean-shutdown \
         downgrade-1.0 force-response-1.0
CustomLog logs/ssl-{{ lookaside_http_hostname }}_request.log \
          "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
</VirtualHost> 
